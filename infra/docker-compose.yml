version: '3.8'

services:
  # Primary Database
  postgres:
    image: postgres:16-alpine
    container_name: secureshare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: secureshare
      POSTGRES_PASSWORD: secureshare_secret
      POSTGRES_DB: secureshare_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureshare -d secureshare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # In-Memory Cache & Token Blacklist
  redis:
    image: redis:7-alpine
    container_name: secureshare_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Message Broker for Celery Workers
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: secureshare_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # RabbitMQ Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # S3 Compatible Object Storage (Local Development)
  minio:
    image: quay.io/minio/minio:latest
    container_name: secureshare_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # Web console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  # Auto-create the S3 bucket on MinIO boot
  minio_create_bucket:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadmin); do echo 'Waiting for MinIO...'; sleep 1; done;
      /usr/bin/mc mb --ignore-existing localminio/secureshare-files;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
